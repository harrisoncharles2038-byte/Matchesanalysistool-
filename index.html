<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7.5 No VPN</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1221;color:#cbd5e1}.mono{font-family:monospace}</style></head><body class="p-2"><div class="max-w-6xl mx-auto">
<div class="bg-[#111d33] border border-[#1e335c] rounded-xl p-3 mb-3 flex justify-between"><h1 class="font-bold text-white">MATCH DIGIT <span class="text-xs bg-blue-900/50 text-blue-300 px-2 py-1 rounded">V7.5 NO-VPN CHROME FIX</span></h1><div id="conn" class="text-xs px-3 py-1 rounded-full bg-yellow-900/30 text-yellow-300">● HTTP Live (No VPN Needed)</div></div>
<div class="grid lg:grid-cols-3 gap-3">
<div class="bg-[#111d33] border border-[#1e335c] rounded-xl p-3">
<div id="marketList" class="space-y-1"></div>
<button id="btnStart" class="w-full mt-3 bg-green-600 text-white py-3 rounded-lg font-bold">▶ START SCANNING (Works without VPN)</button>
<div class="mt-3"><input id="tokenInput" type="password" placeholder="Paste token for auto-trade (needs Opera VPN)" class="w-full bg-[#0b1221] border border-[#1e335c] rounded p-2.5 text-sm text-white"><button id="btnConnect" class="w-full mt-2 bg-[#ff444f] text-white py-2 rounded font-bold">→ Connect (Needs VPN)</button><div id="authStatus" class="text-[11px] mt-1 mono">Analysis works without VPN. Auto-trade needs Opera VPN.</div></div>
<div id="debug" class="text-[10px] mt-2 mono text-green-400">Using CORS proxy - bypasses Safaricom block</div>
</div>
<div class="lg:col-span-2 bg-[#111d33] border border-[#1e335c] rounded-xl p-3"><table class="w-full text-xs"><thead class="text-[11px] text-slate-500"><tr><th class="text-left">Market</th><th>Price</th><th>Digit</th><th>Best</th><th>%</th><th>Status</th></tr></thead><tbody id="results"></tbody></table><div id="bestBox" class="mt-3 hidden bg-green-900/20 border border-green-700/50 rounded p-3"><div id="bestText" class="text-sm font-bold text-green-400"></div></div></div>
</div></div>
<script>
const ALL=["R_100_1s","R_75_1s","R_50_1s","R_25_1s","R_10_1s","R_100","R_75"];
let marketData={}, token=localStorage.getItem('deriv_token')||"", interval=null;
if(token) document.getElementById('tokenInput').value=token;
document.getElementById('marketList').innerHTML=ALL.map(id=>`<label class="flex items-center gap-2 bg-[#0b1221] border border-[#1e335c] rounded p-2.5 cursor-pointer"><input type="checkbox" value="${id}" class="market-check" ${['R_100_1s','R_75_1s'].includes(id)?'checked':''}><span class="text-xs font-bold text-white">${id}</span><span class="ml-auto text-[10px] text-green-400">No VPN OK</span></label>`).join('');
document.getElementById('btnStart').onclick=startPolling;
document.getElementById('btnConnect').onclick=()=>{ token=document.getElementById('tokenInput').value.trim(); localStorage.setItem('deriv_token',token); alert('Token saved. For auto-trade, open this same link in Opera Browser with VPN ON, then press Connect again. Analysis already works without VPN.'); };

function startPolling(){
 let selected=[...document.querySelectorAll('.market-check:checked')].map(c=>c.value).slice(0,2);
 if(selected.length===0) selected=['R_100_1s','R_75_1s'];
 marketData={}; selected.forEach(id=>marketData[id]={ticks:[], price:0, digit:'-', best:'-', bestPct:0, status:'Polling...'});
 render(); if(interval) clearInterval(interval);
 document.getElementById('debug').textContent='Polling '+selected.join(', ')+' via CORS proxy - updates every 1.5s';
 let idx=0;
 interval=setInterval(async()=>{
  const id=selected[idx%selected.length]; idx++;
  try{
   const url='https://api.deriv.com/api/ticks_history?app_id=1089&ticks_history='+id+'&count=1&end=latest&style=ticks';
   const proxied='https://corsproxy.io/?'+encodeURIComponent(url);
   const r=await fetch(proxied); const j=await r.json();
   if(j.history && j.history.prices && j.history.prices[0]){ const price=parseFloat(j.history.prices[0]); update(id, price); }
  }catch(e){
   try{
    const url2='https://api.allorigins.win/raw?url='+encodeURIComponent('https://api.deriv.com/api/ticks_history?app_id=1089&ticks_history='+id+'&count=1&end=latest&style=ticks');
    const r2=await fetch(url2); const j2=await r2.json();
    if(j2.history && j2.history.prices){ const price=parseFloat(j2.history.prices[0]); update(id, price); }
   }catch(e2){ document.getElementById('debug').textContent='Both proxies blocked - install Opera VPN'; }
  }
 },1500);
}
function update(id, price){
 const digit=parseInt(price.toString().slice(-1)); if(isNaN(digit)) return;
 const m=marketData[id]; m.price=price; m.digit=digit; m.ticks.push(digit); if(m.ticks.length>25) m.ticks.shift();
 if(m.ticks.length>=5) m.status='Live '+m.ticks.length+'/25';
 if(m.ticks.length>=25){ const f={}; m.ticks.forEach(x=>f[x]=(f[x]||0)+1); let md=-1,mc=0; for(let k in f) if(f[k]>mc){mc=f[k];md=k;} m.best=md; m.bestPct=Math.round(mc/25*100); m.status=mc>=6?'🔥 EDGE '+md+' '+m.bestPct+'%':'Scanning'; if(m.bestPct>=22){ document.getElementById('bestBox').classList.remove('hidden'); document.getElementById('bestText').textContent='BEST: '+id+' → MATCH '+md+' ('+m.bestPct+'%) - Window '+m.ticks.slice(-10).join(','); } }
 render();
}
function render(){ document.getElementById('results').innerHTML=Object.entries(marketData).map(([id,d])=>`<tr class="border-b border-[#1e335c]/30 ${d.bestPct>=24?'bg-green-900/20':''}"><td class="py-3 font-bold text-white">${id}</td><td class="mono">${d.price?d.price.toFixed(2):'---'}</td><td><span class="w-6 h-6 inline-flex items-center justify-center rounded bg-[#0a2a5c] text-cyan-300">${d.digit}</span></td><td class="font-bold">${d.best}</td><td class="${d.bestPct>=24?'text-green-400 font-bold':''}">${d.bestPct?d.bestPct+'%':''}</td><td class="text-[11px] ${d.status.includes('EDGE')?'text-green-400 font-bold':''}">${d.status}</td></tr>`).join(''); }
startPolling();
</script></body></html>
