<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATCH DIGIT V7.2</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1221;color:#cbd5e1;font-family:sans-serif}.mono{font-family:monospace}</style></head><body class="p-2"><div class="max-w-6xl mx-auto">
<div class="flex justify-between items-center bg-[#111d33] border border-[#1e335c] rounded-xl p-3 mb-3"><h1 class="font-bold text-white">MATCH DIGIT <span class="text-xs bg-green-900/50 text-green-300 px-2 py-1 rounded">V7.2 FIXED BUTTONS</span></h1><div id="conn" class="text-xs px-3 py-1 rounded-full bg-red-900/30 text-red-300 border border-red-700/50">● Disconnected</div></div>

<div class="grid lg:grid-cols-3 gap-3">
<div class="bg-[#111d33] border border-[#1e335c] rounded-xl p-3">
<div class="text-sm font-bold text-white">1. Pick 2-3 Markets</div><div class="text-[11px] text-yellow-400 mb-2">⚠️ Kenya: MAX 3 or Safaricom blocks</div>
<div id="marketList" class="space-y-1"></div>
<div class="flex gap-2 mt-3"><button id="btnFast" type="button" class="flex-1 bg-[#0a2a5c] border border-cyan-700/50 text-cyan-300 py-2 rounded text-xs">Fastest 3 (1s)</button><button id="btnSlow" type="button" class="flex-1 bg-[#1e335c] py-2 rounded text-xs">Slow 3 (2s)</button></div>
<button id="btnStart" type="button" class="w-full mt-3 bg-green-600 hover:bg-green-500 text-white py-3 rounded-lg font-bold text-sm">▶ START SCANNING</button>

<div class="mt-4 border-t border-[#1e335c] pt-3">
<div class="text-xs font-bold text-white">🔑 Deriv API Token</div>
<input id="tokenInput" type="password" placeholder="Paste token here" class="w-full mt-2 bg-[#0b1221] border border-[#1e335c] rounded-lg p-2.5 text-sm text-white">
<div class="flex gap-2 mt-2"><button id="btnConnect" type="button" class="flex-1 bg-[#ff444f] text-white py-3 rounded-lg font-bold text-sm">→ Connect Now</button><input id="stake" value="10" class="w-16 bg-[#0b1221] border border-[#1e335c] rounded p-2 text-sm mono text-right text-white"><label class="flex items-center gap-1 text-xs"><input id="autoTrade" type="checkbox" checked> Auto</label></div>
<div id="authStatus" class="text-[11px] mt-2 mono text-slate-400">Paste token → Connect</div>
</div>
<div id="debug" class="text-[10px] text-slate-500 mt-2 mono break-all">Ready. Select markets and press Start.</div>
</div>

<div class="lg:col-span-2 bg-[#111d33] border border-[#1e335c] rounded-xl p-3">
<div class="flex justify-between items-center"><div class="text-sm font-bold text-white">2. Live Scanner</div><div class="text-xs mono bg-[#0a2a5c] text-cyan-400 px-2 py-1 rounded">SCAN <span id="scan">00:00</span></div></div>
<div class="mt-3 overflow-x-auto"><table class="w-full text-xs"><thead class="text-[11px] text-slate-500"><tr><th class="text-left py-2">Market</th><th>Price</th><th>Digit</th><th>Best</th><th>%</th><th>Status</th></tr></thead><tbody id="results"></tbody></table></div>
<div id="bestEdge" class="mt-4 hidden bg-green-900/20 border border-green-700/50 rounded-lg p-3"><div class="text-green-400 font-bold text-sm" id="bestEdgeText"></div><div class="text-xs mt-1 text-slate-300" id="bestEdgeDetail"></div><div id="tradeResult" class="text-xs mt-2 mono text-cyan-300"></div></div>
</div>
</div></div>

<script>
const ALL_MARKETS=["R_100","R_75","R_50","R_25","R_10","R_100_1s","R_75_1s","R_50_1s","R_25_1s","R_10_1s","1HZ15V","1HZ30V","1HZ90V","1HZ150V","1HZ250V"];
let marketData={}, ws=null, scanSec=0, token=localStorage.getItem('deriv_token')||"", isAuth=false;
const connEl=document.getElementById('conn'), debugEl=document.getElementById('debug'), resultsEl=document.getElementById('results'), authEl=document.getElementById('authStatus');

if(token){ document.getElementById('tokenInput').value=token; authEl.textContent="Token loaded - press Connect Now"; }

setInterval(()=>{ scanSec++; const el=document.getElementById('scan'); if(el) el.textContent=String(Math.floor(scanSec/60)).padStart(2,'0')+':'+String(scanSec%60).padStart(2,'0'); },1000);

function renderMarketList(){
 const list=document.getElementById('marketList');
 list.innerHTML=ALL_MARKETS.map(id=>{
  const checked=(['R_100_1s','R_75_1s','R_50_1s'].includes(id))?'checked':'';
  return `<label class="flex items-center gap-2 bg-[#0b1221] border border-[#1e335c] rounded-lg p-2.5 cursor-pointer hover:border-cyan-700"><input type="checkbox" value="${id}" class="market-check" ${checked}><span class="text-xs font-bold text-white">${id}</span><span class="ml-auto text-[10px] text-slate-500">${id.includes('1s')?'FAST':''}</span></label>`;
 }).join('');
}
renderMarketList();

function selectMarkets(arr){
 document.querySelectorAll('.market-check').forEach(c=>c.checked=arr.includes(c.value));
}

document.getElementById('btnFast').onclick=()=>selectMarkets(['R_100_1s','R_75_1s','R_50_1s']);
document.getElementById('btnSlow').onclick=()=>selectMarkets(['R_10','R_25','R_50']);

function saveAndConnect(){
 token=document.getElementById('tokenInput').value.trim();
 if(!token){ alert('Paste your Deriv API token first'); return; }
 localStorage.setItem('deriv_token',token);
 authEl.textContent='Token saved - Connecting...';
 debugEl.textContent='Token saved: '+token.substring(0,5)+'... Connecting WS';
 startScanning();
}
document.getElementById('btnConnect').onclick=saveAndConnect;
document.getElementById('btnStart').onclick=()=>startScanning();

function startScanning(){
 const checks=document.querySelectorAll('.market-check:checked');
 let selected=[...checks].map(c=>c.value);
 if(selected.length===0){ alert('Select at least 1 market - tick checkboxes'); return; }
 if(selected.length>3){ alert('Too many! Using first 3 only - Safaricom blocks 15'); selected=selected.slice(0,3); }
 marketData={}; resultsEl.innerHTML=''; connEl.textContent='● Connecting '+selected.length+' markets...'; connEl.className='text-xs px-3 py-1 rounded-full bg-yellow-900/30 text-yellow-300 border border-yellow-700/50';
 selected.forEach(id=>{ marketData[id]={ticks:[], price:0, digit:'-', best:'-', bestPct:0, status:'Connecting...'}; });
 debugEl.textContent='Opening WS wss://ws.derivws.com/websockets/v3?app_id=1089 for: '+selected.join(', ');
 if(ws) try{ ws.close(); }catch(e){}
 try{
  ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
  ws.onopen=()=>{ connEl.textContent='● Live '+selected.length+' markets - WS Open'; connEl.className='text-xs px-3 py-1 rounded-full bg-green-900/30 text-green-300 border border-green-700/50'; debugEl.textContent='WS Open - Authorizing and subscribing'; if(token){ ws.send(JSON.stringify({authorize:token})); } selected.forEach(id=>{ ws.send(JSON.stringify({ticks:id, subscribe:1})); }); renderTable(); };
  ws.onmessage=(e)=>{ try{ const d=JSON.parse(e.data); if(d.error){ debugEl.textContent='Error: '+d.error.message; if(d.error.message.toLowerCase().includes('token')||d.error.message.toLowerCase().includes('authoriz')){ authEl.textContent='❌ Invalid token - create new token in Deriv settings'; } return; } if(d.authorize){ isAuth=true; authEl.textContent='✅ '+d.authorize.loginid+' Balance $'+Number(d.authorize.balance).toFixed(2); connEl.textContent='● '+d.authorize.loginid+' $'+Number(d.authorize.balance).toFixed(2); connEl.className='text-xs px-3 py-1 rounded-full bg-green-900/30 text-green-300'; debugEl.textContent='Authorized - Balance $'+d.authorize.balance; } if(d.tick){ const id=d.tick.symbol; if(!marketData[id]) return; const price=parseFloat(d.tick.quote); const digit=parseInt(price.toString().slice(-1)); marketData[id].price=price; marketData[id].digit=digit; marketData[id].ticks.push(digit); if(marketData[id].ticks.length>25) marketData[id].ticks.shift(); if(marketData[id].ticks.length>=25){ const freq={}; marketData[id].ticks.forEach(x=>freq[x]=(freq[x]||0)+1); let maxD=-1,maxC=0; for(let k in freq){ if(freq[k]>maxC){ maxC=freq[k]; maxD=k; } } marketData[id].best=maxD; marketData[id].bestPct=Math.round(maxC/25*100); marketData[id].status=maxC>=6?'EDGE '+maxD+' '+marketData[id].bestPct+'%':'Scanning'; if(maxC>=6 && isAuth && document.getElementById('autoTrade').checked){ const stake=document.getElementById('stake').value; document.getElementById('tradeResult').textContent='Buying MATCH '+maxD+' on '+id+' $'+stake; ws.send(JSON.stringify({buy:1, price:stake, parameters:{amount:stake, basis:"stake", contract_type:"DIGITMATCH", symbol:id, barrier:String(maxD), duration:1, duration_unit:"t"}})); } } renderTable(); checkBest(); } if(d.buy){ document.getElementById('tradeResult').textContent='✅ BOUGHT '+d.buy.contract_id+' Price $'+d.buy.buy_price+' on '+d.buy.longcode; setTimeout(()=>{ document.getElementById('tradeResult').textContent=''; },6000); } }catch(err){ debugEl.textContent='Message parse error: '+err.message; } };
  ws.onerror=(err)=>{ debugEl.textContent='WS Blocked by network - Turn on 1.1.1.1 VPN app and reload'; connEl.textContent='● Blocked - Use VPN'; connEl.className='text-xs px-3 py-1 rounded-full bg-red-900/30 text-red-300'; };
  ws.onclose=()=>{ debugEl.textContent+=' | WS Closed'; };
 }catch(err){ debugEl.textContent='WS create failed: '+err.message; alert('WebSocket failed: '+err.message+' - Use VPN'); }
}

function renderTable(){
 let html='';
 for(const id in marketData){
  const d=marketData[id];
  html+=`<tr class="border-b border-[#1e335c]/30 ${d.bestPct>=24?'bg-green-900/20':''}"><td class="py-2 font-bold text-white">${id}</td><td class="mono">${d.price?d.price.toFixed(2):'---'}</td><td><span class="w-6 h-6 inline-flex items-center justify-center rounded bg-[#0a2a5c] border border-cyan-500/30 text-cyan-300">${d.digit}</span></td><td class="font-bold text-white">${d.best}</td><td class="${d.bestPct>=24?'text-green-400 font-bold':''}">${d.bestPct?d.bestPct+'%':''}</td><td class="text-[11px] ${d.status.includes('EDGE')?'text-green-400 font-bold':''}">${d.status}</td></tr>`;
 }
 resultsEl.innerHTML=html;
}

function checkBest(){
 let best=null;
 for(const id in marketData){ const d=marketData[id]; if(!best || d.bestPct>best.pct) best={id:id, pct:d.bestPct, digit:d.best, ticks:d.ticks}; }
 if(best && best.pct>=22){
  const el=document.getElementById('bestEdge'); el.classList.remove('hidden');
  document.getElementById('bestEdgeText').textContent=`🔥 BEST EDGE: ${best.id} → MATCH ${best.digit} (${best.pct}%)`;
  document.getElementById('bestEdgeDetail').textContent=`Window: ${best.ticks.slice(-10).join(',')} | Stake $${document.getElementById('stake').value} | ${isAuth?'Auto-trading ON':'Connect token to auto-trade'}`;
 }
}
</script></body></html>
