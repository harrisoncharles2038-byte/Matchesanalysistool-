<!-- REPLACE ENTIRE index.html WITH THIS V7.1 -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7.1 Multi Fixed</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1221;color:#cbd5e1}.mono{font-family:monospace}</style></head><body class="p-2"><div class="max-w-6xl mx-auto">
<div class="flex justify-between items-center bg-[#111d33] border border-[#1e335c] rounded-xl p-3 mb-3"><h1 class="font-bold text-white">MATCH DIGIT <span class="text-xs bg-green-900/50 text-green-300 px-2 py-1 rounded">V7.1 FIXED - 1 CONNECTION</span></h1><div id="conn" class="text-xs px-3 py-1 rounded-full bg-red-900/30 text-red-300">● Disconnected</div></div>
<div class="grid lg:grid-cols-3 gap-3">
<div class="bg-[#111d33] border border-[#1e335c] rounded-xl p-3"><div class="text-sm font-bold text-white">1. Pick 2-3 Markets (not 15!)</div><div class="text-[11px] text-yellow-400 mb-2">⚠️ Kenya: Select MAX 3 markets or it blocks</div><div id="marketList" class="grid grid-cols-1 gap-1"></div>
<div class="flex gap-2 mt-2"><button onclick="sel(['R_100_1s','R_75_1s','R_50_1s'])" class="flex-1 bg-cyan-900/40 border border-cyan-700/50 text-cyan-300 py-2 rounded text-xs">Fastest 3 (1s)</button><button onclick="sel(['R_10','R_25','R_50'])" class="flex-1 bg-[#1e335c] py-2 rounded text-xs">Slow 3 (2s)</button></div>
<button onclick="startScanning()" class="w-full mt-3 bg-green-600 text-white py-3 rounded-lg font-bold">▶ START SCANNING</button>
<div class="mt-3 border-t border-[#1e335c] pt-3"><input id="tokenInput" type="password" placeholder="Paste Deriv token" class="w-full bg-[#0b1221] border border-[#1e335c] rounded-lg p-2.5 text-sm"><div class="flex gap-2 mt-2"><button onclick="saveToken()" class="flex-1 bg-[#ff444f] text-white py-2.5 rounded font-bold text-sm">→ Connect Now</button><input id="stake" value="10" class="w-14 bg-[#0b1221] border border-[#1e335c] rounded p-2 mono text-right text-sm"><label class="flex items-center gap-1 text-xs"><input id="autoTrade" type="checkbox" checked> Auto</label></div><div id="authStatus" class="text-[11px] mt-1 mono text-slate-400">Paste token → Connect</div></div>
<div id="debug" class="text-[10px] text-slate-500 mt-2 mono"></div></div>
<div class="lg:col-span-2 bg-[#111d33] border border-[#1e335c] rounded-xl p-3"><div class="flex justify-between"><div class="text-sm font-bold text-white">Live Scanner</div><div class="text-xs mono bg-[#0a2a5c] text-cyan-400 px-2 py-1 rounded">SCAN <span id="scan">00:00</span></div></div><table class="w-full text-xs mt-3"><thead class="text-[11px] text-slate-500"><tr><th class="text-left">Market</th><th>Price</th><th>Digit</th><th>Best</th><th>%</th><th>Status</th></tr></thead><tbody id="results" class="mono"></tbody></table><div id="bestEdge" class="mt-4 hidden bg-green-900/20 border border-green-700/50 rounded-lg p-3"><div class="text-green-400 font-bold text-sm" id="bestEdgeText"></div><div class="text-xs mt-1" id="bestEdgeDetail"></div><div id="tradeResult" class="text-xs mt-2 mono text-cyan-300"></div></div></div>
</div></div>
<script>
const ALL=["R_100","R_75","R_50","R_25","R_10","R_100_1s","R_75_1s","R_50_1s","R_25_1s","R_10_1s","1HZ15V","1HZ30V","1HZ90V","1HZ150V","1HZ250V"];
let marketData={}, ws=null, scanSec=0, token=localStorage.getItem('deriv_token')||"", isAuth=false;
if(token) document.getElementById('tokenInput').value=token;
setInterval(()=>{scanSec++; const s=document.getElementById('scan'); if(s) s.textContent=String(Math.floor(scanSec/60)).padStart(2,'0')+':'+String(scanSec%60).padStart(2,'0');},1000);
document.getElementById('marketList').innerHTML=ALL.map(id=>`<label class="flex items-center gap-2 bg-[#0b1221] border border-[#1e335c] rounded p-2 cursor-pointer"><input type="checkbox" value="${id}" class="market-check" ${['R_100_1s','R_75_1s','R_50_1s'].includes(id)?'checked':''}><span class="text-xs font-bold">${id}</span><span class="text-[10px] text-slate-500 ml-auto">${id.includes('1s')?'FAST':''}</span></label>`).join('');
function sel(arr){ document.querySelectorAll('.market-check').forEach(c=>c.checked=arr.includes(c.value)); }
function saveToken(){ token=document.getElementById('tokenInput').value.trim(); if(!token){alert('Paste token');return;} localStorage.setItem('deriv_token',token); document.getElementById('authStatus').textContent='Token saved - tapping Connect...'; startScanning(); }
function startScanning(){
 const selected=[...document.querySelectorAll('.market-check:checked')].map(c=>c.value).slice(0,3);
 if(selected.length===0){alert('Select 1-3 markets');return;}
 if(selected.length>3){alert('Kenya network blocks >3. Selecting first 3 only'); selected.splice(3); }
 marketData={}; document.getElementById('results').innerHTML=''; document.getElementById('conn').textContent='● Connecting '+selected.length+' markets...'; document.getElementById('conn').className='text-xs px-3 py-1 rounded-full bg-yellow-900/30 text-yellow-300';
 selected.forEach(id=>marketData[id]={ticks:[], price:5000+Math.random()*500, digit:'-', best:'-', bestPct:0, status:'Connecting'});
 if(ws) ws.close();
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{ document.getElementById('conn').textContent='● Live '+selected.length+' markets'; document.getElementById('conn').className='text-xs px-3 py-1 rounded-full bg-green-900/30 text-green-300 border border-green-700/50'; document.getElementById('debug').textContent='WS open - subscribing...'; if(token){ ws.send(JSON.stringify({authorize:token})); } selected.forEach(id=>ws.send(JSON.stringify({ticks:id, subscribe:1}))); };
 ws.onmessage=(e)=>{ const d=JSON.parse(e.data); if(d.error){ document.getElementById('debug').textContent='Error: '+d.error.message; if(d.error.message.toLowerCase().includes('token')) document.getElementById('authStatus').textContent='❌ Invalid token - create new one in Deriv'; } if(d.authorize){ isAuth=true; document.getElementById('authStatus').textContent='✅ '+d.authorize.loginid+' Balance $'+d.authorize.balance.toFixed(2); document.getElementById('conn').textContent='● '+d.authorize.loginid+' $'+d.authorize.balance.toFixed(2); } if(d.tick){ const id=d.tick.symbol; if(!marketData[id]) return; const price=parseFloat(d.tick.quote); const digit=parseInt(price.toString().slice(-1)); marketData[id].price=price; marketData[id].digit=digit; marketData[id].ticks.push(digit); if(marketData[id].ticks.length>25) marketData[id].ticks.shift(); if(marketData[id].ticks.length>=25){ const f={}; marketData[id].ticks.forEach(x=>f[x]=(f[x]||0)+1); let md=-1,mc=0; for(let k in f) if(f[k]>mc){mc=f[k];md=k;} marketData[id].best=md; marketData[id].bestPct=Math.round(mc/25*100); marketData[id].status=mc>=6?`EDGE ${md} ${marketData[id].bestPct}%`:'Scanning'; if(mc>=6 && isAuth && document.getElementById('autoTrade').checked){ ws.send(JSON.stringify({buy:1, price:document.getElementById('stake').value, parameters:{amount:document.getElementById('stake').value, basis:"stake", contract_type:"DIGITMATCH", symbol:id, barrier:md.toString(), duration:1, duration_unit:"t"}})); document.getElementById('tradeResult').textContent='Buying MATCH '+md+' on '+id; } } render(); } if(d.buy){ document.getElementById('tradeResult').textContent='✅ BOUGHT '+d.buy.contract_id+' $'+d.buy.buy_price; } };
 ws.onerror=()=>{ document.getElementById('debug').textContent='WS blocked - turn on 1.1.1.1 VPN'; document.getElementById('conn').textContent='● Blocked - use VPN'; };
}
function render(){
 const tb=document.getElementById('results'); tb.innerHTML=Object.entries(marketData).map(([id][d])=>`<tr class="border-b border-[#1e335c]/30 ${d.bestPct>=24?'bg-green-900/20':''}"><td class="py-2 font-bold text-white">${id}</td><td>${d.price?d.price.toFixed(2):'---'}</td><td><span class="w-6 h-6 inline-flex items-center justify-center rounded bg-[#0a2a5c] border border-cyan-500/30 text-cyan-300">${d.digit}</span></td><td class="font-bold text-white">${d.best}</td><td class="${d.bestPct>=24?'text-green-400 font-bold':''}">${d.bestPct?d.bestPct+'%':''}</td><td class="text-[11px] ${d.status.includes('EDGE')?'text-green-400 font-bold':''}">${d.status}</td></tr>`).join('');
 let best=null; for(let id in marketData) if(!best || marketData[id].bestPct>best.pct) best={id:id, pct:marketData[id].bestPct, digit:marketData[id].best, ticks:marketData[id].ticks};
 if(best && best.pct>=22){ document.getElementById('bestEdge').classList.remove('hidden'); document.getElementById('bestEdgeText').textContent=`🔥 BEST: ${best.id} → MATCH ${best.digit} (${best.pct}%)`; document.getElementById('bestEdgeDetail').textContent=`Window: ${best.ticks.slice(-10).join(',')} | Stake $${document.getElementById('stake').value}`; }
}
startScanning();
</script></body></html>
