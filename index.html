<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7.3 Kenya Fix</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1221;color:#cbd5e1}.mono{font-family:monospace}</style></head><body class="p-2"><div class="max-w-6xl mx-auto">
<div class="flex justify-between items-center bg-[#111d33] border border-[#1e335c] rounded-xl p-3 mb-3"><h1 class="font-bold text-white">MATCH DIGIT <span class="text-xs bg-yellow-900/50 text-yellow-300 px-2 py-1 rounded">V7.3 KENYA FIX</span></h1><div id="conn" class="text-xs px-3 py-1 rounded-full bg-red-900/30 text-red-300">● Disconnected</div></div>
<div class="grid lg:grid-cols-3 gap-3">
<div class="bg-[#111d33] border border-[#1e335c] rounded-xl p-3">
<div id="marketList" class="space-y-1"></div>
<div class="flex gap-2 mt-3"><button id="btnFast" class="flex-1 bg-[#0a2a5c] border border-cyan-700/50 text-cyan-300 py-2 rounded text-xs">Fastest 3 (1s)</button><button id="btnSlow" class="flex-1 bg-[#1e335c] py-2 rounded text-xs">Slow 3 (2s)</button></div>
<button id="btnStart" class="w-full mt-3 bg-green-600 text-white py-3 rounded-lg font-bold">▶ START SCANNING</button>
<div class="mt-3 border-t border-[#1e335c] pt-3"><input id="tokenInput" type="password" placeholder="Paste token" class="w-full bg-[#0b1221] border border-[#1e335c] rounded-lg p-2.5 text-sm text-white"><div class="flex gap-2 mt-2"><button id="btnConnect" class="flex-1 bg-[#ff444f] text-white py-3 rounded-lg font-bold">→ Connect Now</button><input id="stake" value="10" class="w-16 bg-[#0b1221] border border-[#1e335c] rounded p-2 mono text-right"><label class="flex items-center gap-1 text-xs"><input id="autoTrade" type="checkbox" checked> Auto</label></div><div id="authStatus" class="text-[11px] mt-2 mono text-slate-400">Ready</div></div>
<div id="debug" class="text-[10px] mt-2 mono text-slate-500">Ready</div>
</div>
<div class="lg:col-span-2 bg-[#111d33] border border-[#1e335c] rounded-xl p-3"><div class="flex justify-between"><div class="text-sm font-bold text-white">Live Scanner</div><div class="text-xs mono bg-[#0a2a5c] text-cyan-400 px-2 py-1 rounded">SCAN <span id="scan">00:00</span></div></div><table class="w-full text-xs mt-3"><thead class="text-[11px] text-slate-500"><tr><th class="text-left">Market</th><th>Price</th><th>Digit</th><th>Best</th><th>%</th><th>Status</th></tr></thead><tbody id="results"></tbody></table><div id="tradeResult" class="text-xs mt-3 mono text-cyan-300"></div></div>
</div></div>
<script>
const ALL=["R_100","R_75","R_50","R_25","R_10","R_100_1s","R_75_1s","R_50_1s","R_25_1s","R_10_1s","1HZ15V","1HZ30V","1HZ90V","1HZ150V","1HZ250V"];
let marketData={}, ws=null, scanSec=0, token=localStorage.getItem('deriv_token')||"", isAuth=false, httpInterval=null, wsAttempts=0;
const WS_SERVERS=["wss://ws.binaryws.com/websockets/v3?app_id=1089","wss://ws.derivws.com/websockets/v3?app_id=1089","wss://ws.derivws.com/websockets/v3?app_id=16929"];
const connEl=document.getElementById('conn'), debugEl=document.getElementById('debug'), authEl=document.getElementById('authStatus');
if(token) document.getElementById('tokenInput').value=token;
setInterval(()=>{scanSec++; document.getElementById('scan').textContent=String(Math.floor(scanSec/60)).padStart(2,'0')+':'+String(scanSec%60).padStart(2,'0');},1000);
document.getElementById('marketList').innerHTML=ALL.map(id=>`<label class="flex items-center gap-2 bg-[#0b1221] border border-[#1e335c] rounded-lg p-2.5 cursor-pointer"><input type="checkbox" value="${id}" class="market-check" ${['R_100_1s','R_75_1s'].includes(id)?'checked':''}><span class="text-xs font-bold text-white">${id}</span><span class="ml-auto text-[10px] text-slate-500">FAST</span></label>`).join('');
document.getElementById('btnFast').onclick=()=>{document.querySelectorAll('.market-check').forEach(c=>c.checked=['R_100_1s','R_75_1s','R_50_1s'].includes(c.value));};
document.getElementById('btnSlow').onclick=()=>{document.querySelectorAll('.market-check').forEach(c=>c.checked=['R_10','R_25','R_50'].includes(c.value));};
document.getElementById('btnConnect').onclick=()=>{ token=document.getElementById('tokenInput').value.trim(); if(!token){alert('Paste token');return;} localStorage.setItem('deriv_token',token); startScanning(); };
document.getElementById('btnStart').onclick=()=>startScanning();

function startScanning(){
 let selected=[...document.querySelectorAll('.market-check:checked')].map(c=>c.value).slice(0,3);
 if(selected.length===0) selected=['R_100_1s','R_75_1s'];
 marketData={}; selected.forEach(id=>marketData[id]={ticks:[], price:0, digit:'-', best:'-', bestPct:0, status:'Connecting...'});
 render(); wsAttempts=0; if(httpInterval) clearInterval(httpInterval);
 connEl.textContent='● Trying servers...'; debugEl.textContent='Trying '+WS_SERVERS[0];
 connectWS(selected,0);
}

function connectWS(selected, idx){
 if(idx>=WS_SERVERS.length){ debugEl.textContent='All WS blocked - switching to HTTP polling (works in Kenya)'; connEl.textContent='● HTTP Mode (Kenya)'; startHttpPolling(selected); return; }
 const server=WS_SERVERS[idx];
 debugEl.textContent='Trying WS '+server;
 if(ws) try{ws.close();}catch(e){}
 ws=new WebSocket(server);
 ws.onopen=()=>{ connEl.textContent='● Live '+selected.length+' markets via '+server.split('/')[2]; connEl.className='text-xs px-3 py-1 rounded-full bg-green-900/30 text-green-300'; if(token){ ws.send(JSON.stringify({authorize:token})); debugEl.textContent='WS Open '+server+' - authorizing...'; } selected.forEach(id=>ws.send(JSON.stringify({ticks:id, subscribe:1}))); };
 ws.onmessage=(e)=>{ const d=JSON.parse(e.data); if(d.error){ debugEl.textContent='Error '+d.error.message+' - trying next server'; if(idx<2) connectWS(selected, idx+1); return; } if(d.authorize){ isAuth=true; authEl.textContent='✅ '+d.authorize.loginid+' $'+Number(d.authorize.balance).toFixed(2); connEl.textContent='● '+d.authorize.loginid+' $'+Number(d.authorize.balance).toFixed(2); } if(d.tick){ const id=d.tick.symbol; if(!marketData[id]) return; updateMarket(id, parseFloat(d.tick.quote)); } if(d.buy){ document.getElementById('tradeResult').textContent='✅ BOUGHT '+d.buy.contract_id+' $'+d.buy.buy_price; } };
 ws.onerror=()=>{ debugEl.textContent='WS '+server+' blocked - trying next...'; connectWS(selected, idx+1); };
 ws.onclose=()=>{ if(Object.values(marketData).some(m=>m.ticks.length<5)){ connectWS(selected, idx+1); } };
}

function updateMarket(id, price){
 const digit=parseInt(price.toString().slice(-1)); if(isNaN(digit)) return;
 const m=marketData[id]; m.price=price; m.digit=digit; m.ticks.push(digit); if(m.ticks.length>25) m.ticks.shift();
 if(m.ticks.length>=25){ const f={}; m.ticks.forEach(x=>f[x]=(f[x]||0)+1); let md=-1,mc=0; for(let k in f) if(f[k]>mc){mc=f[k];md=k;} m.best=md; m.bestPct=Math.round(mc/25*100); m.status=mc>=6?'EDGE '+md+' '+m.bestPct+'%':'Scanning'; if(mc>=6 && isAuth && document.getElementById('autoTrade').checked && ws && ws.readyState===1){ const stake=document.getElementById('stake').value; ws.send(JSON.stringify({buy:1, price:stake, parameters:{amount:stake, basis:"stake", contract_type:"DIGITMATCH", symbol:id, barrier:String(md), duration:1, duration_unit:"t"}})); document.getElementById('tradeResult').textContent='Buying MATCH '+md+' on '+id; } }
 render();
}

function startHttpPolling(selected){
 debugEl.textContent='HTTP polling every 1.2s - '+selected.join(', ')+' - Works even when WS blocked';
 connEl.textContent='● HTTP Live (Kenya Fix)';
 let i=0;
 httpInterval=setInterval(async()=>{
  const id=selected[i%selected.length]; i++;
  try{
   const r=await fetch('https://api.deriv.com/api/ticks_history?app_id=1089&ticks_history='+id+'&count=1&end=latest&style=ticks');
   const t=await r.text(); const j=JSON.parse(t);
   if(j.history && j.history.prices && j.history.prices.length){ const p=parseFloat(j.history.prices[0]); updateMarket(id,p); }
  }catch(e){ debugEl.textContent='HTTP error - check internet '+e.message; }
 },1200);
}

function render(){
 document.getElementById('results').innerHTML=Object.entries(marketData).map(([id,d])=>`<tr class="border-b border-[#1e335c]/30 ${d.bestPct>=24?'bg-green-900/20':''}"><td class="py-2 font-bold text-white">${id}</td><td class="mono">${d.price?d.price.toFixed(2):'---'}</td><td><span class="w-6 h-6 inline-flex items-center justify-center rounded bg-[#0a2a5c] border border-cyan-500/30 text-cyan-300">${d.digit}</span></td><td class="font-bold text-white">${d.best}</td><td class="${d.bestPct>=24?'text-green-400 font-bold':''}">${d.bestPct?d.bestPct+'%':''}</td><td class="text-[11px] ${d.status.includes('EDGE')?'text-green-400 font-bold':''}">${d.status}</td></tr>`).join('');
}
</script></body></html>
